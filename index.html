<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Flow Forge · 画出你的用户流程</title><style>
:root{--bg:#101522;--panel:#171e2d;--line:#2b374d;--text:#edf2f6;--muted:#93a0b3;--blue:#91d6ff;--pink:#ff9fce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#26324f,transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:1240px;margin:auto;padding:26px 24px 45px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:850;font-size:20px}.brand b{color:var(--pink);font-size:27px;margin-right:9px}.tag{font-size:11px;color:var(--muted);letter-spacing:2px}.hero{padding:48px 0 28px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-4px;margin:0 0 18px}h1 span{color:var(--blue)}.hero p{color:var(--muted);margin:0;max-width:620px;line-height:1.7}.button{background:#202a3d;color:var(--text);border:1px solid #3a4a66;border-radius:10px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#101522;border-color:var(--blue)}.toolbar{display:flex;gap:9px;margin-bottom:16px}.board{height:510px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background-color:#121a29;background-image:linear-gradient(#1c2940 1px,transparent 1px),linear-gradient(90deg,#1c2940 1px,transparent 1px);background-size:28px 28px}.node{position:absolute;width:180px;background:var(--panel);border:1px solid #3d506d;border-radius:14px;padding:14px;cursor:grab;box-shadow:0 10px 25px #0003}.node strong{display:block;font-size:13px;color:var(--blue);margin-bottom:7px}.node span{font-size:12px;color:var(--muted)}.node:after{content:'→';position:absolute;right:-38px;top:30px;color:var(--pink);font-size:25px}.node:last-child:after{display:none}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:12px}.hint{padding:15px 0;color:var(--muted);font-size:12px;line-height:1.7}.board{overflow:auto}.canvas{position:relative;width:1120px;height:700px;min-width:1120px}.node{touch-action:none;padding-top:10px}.node input,.node textarea{width:100%;background:transparent;color:var(--text);border:0;font:inherit;resize:vertical}.node input{font-weight:700;margin:8px 0}.node textarea{font-size:12px;color:var(--muted);min-height:48px;touch-action:auto}.node:after{display:none}.grip{display:flex;justify-content:space-between;color:var(--blue);font-size:11px;user-select:none;cursor:grab}.delete{background:none;border:0;color:var(--pink);cursor:pointer}.canvas svg{position:absolute;inset:0;pointer-events:none}.toolbar{flex-wrap:wrap}@media(max-width:700px){.hero{display:block}.hero .button{margin-top:18px}h1{letter-spacing:-2px}.app{padding:20px 14px}.tag{letter-spacing:0}.legend{gap:12px}}
</style></head><body><main class="app"><header><div class="brand"><b>⌁</b>FLOW FORGE</div><div class="tag">MAP THE MOMENT</div></header><section class="hero"><div><h1>让用户流程，<span>一眼变清楚。</span></h1><p>把产品的关键步骤放进画布，编辑步骤并拖动节点布局，快速和团队讨论“用户下一步要做什么”。</p></div><button class="button primary" id="reset">重置流程 ↺</button></section><div class="toolbar"><button class="button" id="add">＋ 添加步骤</button><button class="button" id="export">↓ 导出流程 PNG</button></div><section class="board" id="board" aria-label="流程画布，可横向滚动"><div class="canvas" id="canvas"><svg width="1120" height="700" aria-hidden="true"></svg></div></section><div class="legend"><span>拖动卡片顶部移动 · 按步骤编号连接 · 自动保存</span><span>FLOW FORGE / VIBE CODING TOOL</span></div><div class="hint">一个好的流程图不需要复杂：先让用户进入，再完成一个核心动作，最后给出明确结果。</div></main><script>
const board=document.getElementById('board'),canvas=document.getElementById('canvas'),svg=canvas.querySelector('svg');
const initial=()=>[{title:'进入产品',desc:'用户第一次看到什么？',x:50,y:70},{title:'完成核心动作',desc:'最重要的一步是什么？',x:320,y:240},{title:'得到结果',desc:'用户如何知道成功？',x:590,y:70},{title:'再来一次',desc:'什么让用户愿意回来？',x:860,y:240}];let nodes=initial();try{const a=JSON.parse(localStorage.getItem('flow-forge'));if(Array.isArray(a)&&a.every(n=>typeof n.title==='string'&&typeof n.desc==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y)))nodes=a}catch{}
function save(){try{localStorage.setItem('flow-forge',JSON.stringify(nodes))}catch{}}
function links(){svg.replaceChildren();nodes.slice(0,-1).forEach((n,i)=>{const next=nodes[i+1],p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${n.x+180} ${n.y+55} C${n.x+215} ${n.y+55} ${next.x-35} ${next.y+55} ${next.x} ${next.y+55}`);p.setAttribute('stroke','#ff9fce');p.setAttribute('fill','none');p.setAttribute('stroke-width','2');svg.append(p)})}
function render(){canvas.querySelectorAll('.node').forEach(n=>n.remove());nodes.forEach((n,i)=>{const el=document.createElement('div');el.className='node';el.style.left=n.x+'px';el.style.top=n.y+'px';const grip=document.createElement('div');grip.className='grip';grip.textContent=`${String(i+1).padStart(2,'0')} / 拖动`;const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label',`删除步骤 ${i+1}`);del.onclick=()=>{nodes.splice(i,1);save();render()};grip.append(del);const title=document.createElement('input');title.value=n.title;title.maxLength=32;title.setAttribute('aria-label',`步骤 ${i+1} 名称`);title.oninput=()=>{n.title=title.value;save()};const desc=document.createElement('textarea');desc.value=n.desc;desc.maxLength=100;desc.setAttribute('aria-label',`步骤 ${i+1} 说明`);desc.oninput=()=>{n.desc=desc.value;save()};el.append(grip,title,desc);canvas.append(el);let dx=0,dy=0;grip.onpointerdown=e=>{if(e.target===del)return;dx=e.clientX-n.x;dy=e.clientY-n.y;grip.setPointerCapture(e.pointerId);el.style.zIndex=2};grip.onpointermove=e=>{if(!grip.hasPointerCapture(e.pointerId))return;n.x=Math.max(8,Math.min(930,e.clientX-dx));n.y=Math.max(8,Math.min(545,e.clientY-dy));el.style.left=n.x+'px';el.style.top=n.y+'px';links()};grip.onpointerup=()=>{el.style.zIndex=1;save()};grip.onlostpointercapture=save});links()}
document.getElementById('reset').onclick=()=>{if(confirm('恢复示例流程？当前修改将被替换。')){nodes=initial();save();render()}};document.getElementById('add').onclick=()=>{if(nodes.length>=20){alert('最多支持 20 个步骤，请先整理现有流程。');return}nodes.push({title:'新步骤',desc:'描述用户在这里的操作',x:30+(nodes.length%4)*265,y:60+(Math.floor(nodes.length/4)%3)*190});save();render()};
document.getElementById('export').onclick=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');c.width=2240;c.height=1560;x.scale(2,2);x.fillStyle='#121a29';x.fillRect(0,0,1120,780);x.fillStyle='#91d6ff';x.font='bold 28px sans-serif';x.fillText('FLOW FORGE',32,48);x.translate(0,80);x.strokeStyle='#ff9fce';x.lineWidth=2;nodes.slice(0,-1).forEach((n,i)=>{const next=nodes[i+1];x.beginPath();x.moveTo(n.x+180,n.y+55);x.bezierCurveTo(n.x+215,n.y+55,next.x-35,next.y+55,next.x,next.y+55);x.stroke()});function wrap(text,px,py,w){let line='',row=0;for(const ch of text){if(x.measureText(line+ch).width>w){x.fillText(line,px,py+row*19);line='';row++;if(row===3)return}line+=ch}x.fillText(line,px,py+row*19)}nodes.forEach((n,i)=>{x.fillStyle='#171e2d';x.strokeStyle='#3d506d';x.beginPath();x.roundRect(n.x,n.y,180,142,14);x.fill();x.stroke();x.fillStyle='#91d6ff';x.font='bold 13px sans-serif';wrap(`${i+1}. ${n.title}`,n.x+12,n.y+25,156);x.fillStyle='#93a0b3';x.font='12px sans-serif';wrap(n.desc,n.x+12,n.y+83,156)});const a=document.createElement('a');a.download='flow-forge.png';a.href=c.toDataURL();a.click()};render();
</script></body></html>
